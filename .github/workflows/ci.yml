name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Ruff and pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: insureclear:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the container and check /health
        run: |
          docker run -d --name api -p 8000:8000 insureclear:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then echo; exit 0; fi
            if [ "$(docker inspect -f '{{.State.Running}}' api)" != "true" ]; then
              echo "The container stopped."
              break
            fi
            sleep 2
          done
          echo "---- docker ps ----"
          docker ps -a
          echo "---- exit code and error ----"
          docker inspect -f '{{.State.ExitCode}} {{.State.Error}}' api
          echo "---- logs ----"
          docker logs api
          exit 1